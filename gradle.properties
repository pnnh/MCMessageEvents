# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache can fail on first NeoForge artifact creation on some hosts.
org.gradle.configuration-cache=false

# If HTTPS fails with PKIX, run with:
#   $env:JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStoreType=Windows-ROOT"


# https://github.com/neoforged/ModDevGradle
# Latest Parchment versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Match the MCBilingual reference toolchain unless a later pin is required.
neo_version=21.1.251
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod properties

# Must match MCMessageEvents.MOD_ID and the regex [a-z][a-z0-9_]{1,63}
mod_id=mcmessageevents
mod_name=MCMessageEvents
mod_license=All Rights Reserved
mod_version=0.1.0
# Matches the base package used for the mod sources.
mod_group_id=pnnh.mcmessageevents

# Optional soft integration. compileOnly / localRuntime only; not a hard load dependency.
# Pin during /speckit-plan after confirming the latest 1.21.1 NeoForge artifact.
kubejs_version=2101.7.2-build.379
